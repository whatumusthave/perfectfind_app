<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Perfect Paw Match - Cosmic Puzzle Adventure</title>



<script>
(function () {
  const CARD_DATA = [
    { name: "Amethyst Heart", file: "./assets/cards/1amethyst-heart.png" },
    { name: "Celestial Potion", file: "./assets/cards/2celestial-potion.png" },
    { name: "Silver Shopping Bag", file: "./assets/cards/3silver-shopping-bag.png" },
    { name: "Terquois Cushion", file: "./assets/cards/4terquois-cushion.png" },
    { name: "Sapphire Paw", file: "./assets/cards/5sapphire-paw.png" },
    { name: "Fuchsia Ribbon", file: "./assets/cards/6fuchsia-ribbon.png" },
    { name: "Jeweled Keyhole", file: "./assets/cards/7jeweled-keyhole.png" },
    { name: "Golden Paw", file: "./assets/cards/8golden-paw.png" },
    { name: "Pinkruby Pufferfish", file: "./assets/cards/9pinkruby-pufferfish.png" },
    { name: "Crystal Ball", file: "./assets/cards/10crystal-ball.png" },
    { name: "Indigo Bowtie", file: "./assets/cards/11indigo-bowtie.png" },
    { name: "Royal Cat Bed", file: "./assets/cards/12royal-cat-bed.png" },
    { name: "Zio", file: "./assets/cards/13zio.png" },
    { name: "Ziawink", file: "./assets/cards/14ziawink.png" }
  ];

  function renderCollectionGrid(root) {
    if (!root || root.dataset.rendered === "1") return;
    root.dataset.rendered = "1";
    root.innerHTML = "";

    const frag = document.createDocumentFragment();

    CARD_DATA.forEach(card => {
      const item = document.createElement("article");
      item.className = "collection-card";
      item.innerHTML = `
        <div class="collection-card-image-wrap">
          <img
            class="collection-card-image"
            src="${card.file}"
            alt="${card.name}"
            width="160"
            height="160"
            loading="lazy"
            decoding="async"
            onerror="this.onerror=null;this.src='./assets/cards/8golden-paw.png';"
          />
        </div>
        <h3 class="collection-card-title">${card.name}</h3>
      `;
      frag.appendChild(item);
    });

    root.appendChild(frag);
  }

  function boot() {
    const targets = [
      document.querySelector("#collection-grid"),
      document.querySelector(".collection-grid"),
      document.querySelector("[data-collection-grid]"),
      document.querySelector("#royal-collection-grid")
    ].filter(Boolean);

    targets.forEach(renderCollectionGrid);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>

</body></html>
