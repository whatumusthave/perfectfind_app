<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Perfect Paw Match</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#1b0b2f;--h:#322247;--g:#ffd700;--l:#cdbdff;--r:#ff6b6b;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--l);font-family:'Plus Jakarta Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:rgba(27,11,47,.95);border-bottom:1px solid rgba(205,189,255,.15);flex-shrink:0;}
.logo{font-size:13px;font-weight:800;color:var(--g);}
#score{font-size:13px;font-weight:800;color:var(--g);background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:3px 10px;}
#timer{font-size:17px;font-weight:800;color:var(--g);}
#stage-label{font-size:11px;font-weight:700;color:var(--l);letter-spacing:.1em;}
.game-wrap{flex:1;display:flex;align-items:stretch;gap:4px;padding:4px;overflow:hidden;min-height:0;}
.side-deck{width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.deck-wrap{position:relative;width:54px;height:78px;cursor:pointer;}
.deck-wrap:active{transform:scale(.95);}
.deck-back-card{position:absolute;width:52px;height:74px;background:linear-gradient(135deg,#3d2e6b,#251847);border:1.5px solid rgba(205,189,255,.5);border-radius:7px;}
.deck-top-open{position:absolute;bottom:0;left:0;width:52px;height:74px;border:2px solid var(--g);border-radius:7px;overflow:hidden;box-shadow:0 0 12px rgba(255,215,0,.35);}
.deck-top-open img{width:100%;height:100%;object-fit:cover;}
.deck-count{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--l);background:var(--h);border-radius:10px;padding:2px 7px;}
.deck-empty{font-size:20px;color:rgba(205,189,255,.3);}
#game-board{flex:1;position:relative;background:rgba(45,27,105,.12);border:1px solid rgba(205,189,255,.08);border-radius:12px;overflow:hidden;min-width:0;}
.tile{position:absolute;width:56px;height:56px;border-radius:6px;overflow:hidden;background:#2d1b5e;border:1.5px solid rgba(100,80,160,.6);box-shadow:2px 2px 6px rgba(0,0,0,.6);}
.tile img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block;}
.tile.free{cursor:pointer;border-color:rgba(205,189,255,.5);box-shadow:2px 2px 8px rgba(0,0,0,.5),0 0 6px rgba(205,189,255,.15);}
@media(hover:hover){.tile.free:hover{border-color:var(--g);box-shadow:0 0 16px rgba(255,215,0,.5);z-index:99999!important;transform:scale(1.05);}}
.tile.free:active{transform:scale(.92);}
.tile.blocked{filter:brightness(.35) saturate(.1);cursor:not-allowed;border-color:rgba(60,40,100,.4);}
.bottom{flex-shrink:0;padding:0 6px 6px;display:flex;flex-direction:column;gap:3px;}
#slot-count{text-align:center;font-size:10px;font-weight:700;color:var(--l);letter-spacing:.08em;}
#slot-bar{display:flex;justify-content:center;gap:3px;background:rgba(45,27,105,.25);border:1px solid rgba(205,189,255,.12);border-radius:8px;padding:4px;align-items:center;flex-wrap:nowrap;overflow-x:auto;}
.slot{width:50px;height:50px;border:2px dashed rgba(205,189,255,.18);border-radius:6px;background:rgba(50,34,71,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.slot.filled{border-color:rgba(255,215,0,.45);background:rgba(255,215,0,.06);}
.slot.bonus{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.06);}
.slot img{width:42px;height:42px;object-fit:cover;border-radius:5px;}
.action-btns{display:flex;justify-content:center;gap:10px;}
.action-btns button{width:78px;height:48px;border:none;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;line-height:1.3;}
.action-btns button:active{transform:scale(.92);}
#undo-btn,#shuffle-btn{background:var(--g);color:#1a0a2e;box-shadow:0 0 12px rgba(255,215,0,.3);}
#restart-btn{background:rgba(205,189,255,.1);color:var(--l);border:2px solid rgba(205,189,255,.25);}
#overlay{display:none;position:fixed;inset:0;background:rgba(27,11,47,.9);backdrop-filter:blur(14px);z-index:10000;align-items:center;justify-content:center;}
.result-box{background:rgba(50,34,71,.97);border:1px solid rgba(205,189,255,.2);border-radius:22px;padding:28px 24px;text-align:center;max-width:290px;width:90%;}
.result-box.win{box-shadow:0 0 60px rgba(255,215,0,.4);}
.result-box.lose{box-shadow:0 0 60px rgba(255,107,107,.3);}
.result-box h2{font-size:22px;font-weight:800;color:var(--g);margin:8px 0;}
.result-score,.clear-rate{font-size:14px;font-weight:700;margin-bottom:6px;}
.clear-rate{color:var(--r);}
.result-box p{font-size:12px;color:rgba(205,189,255,.7);margin-bottom:14px;}
.result-box button{display:block;width:100%;padding:11px;margin-top:7px;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.result-box button:first-of-type{background:var(--g);color:#1a0a2e;}
.result-box button:not(:first-of-type){background:transparent;color:var(--l);border:2px solid rgba(205,189,255,.3);margin-top:5px;}
</style>
</head>
<body>
<header>
  <div class="logo">🐾 Perfect Paw Match</div>
  <div id="stage-label">Stage 1</div>
  <div id="timer">01:00</div>
  <div id="score">★ 0</div>
</header>
<div class="game-wrap">
  <div class="side-deck" id="left-deck"></div>
  <div id="game-board"></div>
  <div class="side-deck" id="right-deck"></div>
</div>
<div class="bottom">
  <div id="slot-count">SLOT: 0 / 7</div>
  <div id="slot-bar"></div>
  <div class="action-btns">
    <button id="undo-btn" onclick="doUndo()">↩<br>UNDO(2)</button>
    <button id="shuffle-btn" onclick="doShuffle()">⟳<br>SHUF(1)</button>
    <button id="restart-btn" onclick="restart()">↺<br>RESTART</button>
  </div>
</div>
<div id="overlay"></div>
<script src="game.js"></script>
</body>
</html>
