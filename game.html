<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Perfect Paw Match</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#1b0b2f;--h:#322247;--g:#ffd700;--l:#cdbdff;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--l);font-family:'Plus Jakarta Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;}
header{display:flex;align-items:center;justify-content:space-between;padding:5px 14px;background:rgba(27,11,47,.97);border-bottom:1px solid rgba(205,189,255,.1);flex-shrink:0;}
.logo{font-size:13px;font-weight:800;color:var(--g);}
#score{font-size:12px;font-weight:800;color:var(--g);background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:3px 10px;}
#stage-label{font-size:11px;font-weight:700;color:var(--l);}

#game-board{flex:1;position:relative;overflow:hidden;min-height:0;}

.tile{position:absolute;border-radius:8px;overflow:hidden;}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;border-radius:7px;}
.tile.free img{filter:brightness(1);border:2.5px solid rgba(255,215,0,.85);border-radius:7px;box-shadow:0 2px 10px rgba(255,215,0,.3);}
.tile.free{cursor:pointer;}
@media(hover:hover){.tile.free:hover img{filter:brightness(1.15);box-shadow:0 0 18px rgba(255,215,0,.65);}}
.tile.free:active img{transform:scale(.88);}
.tile.blocked img{filter:brightness(.2) saturate(.05);border:1.5px solid rgba(60,40,100,.2);border-radius:7px;}
.tile.blocked{cursor:not-allowed;}

.bottom{flex-shrink:0;background:rgba(12,4,24,.97);border-top:1px solid rgba(205,189,255,.08);padding:6px 10px 10px;}
.slot-row{display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:8px;}
#slot-count{font-size:10px;font-weight:700;color:rgba(205,189,255,.4);margin-right:4px;white-space:nowrap;}
#slot-bar{display:flex;gap:3px;}
.slot{width:40px;height:40px;border:2px dashed rgba(205,189,255,.12);border-radius:7px;background:rgba(50,34,71,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.slot.filled{border-color:rgba(255,215,0,.45);background:rgba(255,215,0,.06);}
.slot img{width:34px;height:34px;object-fit:cover;border-radius:5px;}

/* 3 round icon buttons */
.action-btns{display:flex;justify-content:center;gap:24px;}
.act-btn{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 40% 35%,#ffe566,#c8880a);box-shadow:0 4px 16px rgba(255,215,0,.35),inset 0 1px 0 rgba(255,255,255,.3);}
.act-btn:active{transform:scale(.86);}
.act-btn svg{width:30px;height:30px;}
.badge{position:absolute;top:1px;right:1px;width:19px;height:19px;border-radius:50%;background:#e53;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.4);}

#overlay{display:none;position:fixed;inset:0;background:rgba(20,8,40,.9);backdrop-filter:blur(16px);z-index:10000;align-items:center;justify-content:center;}
.result-box{background:rgba(50,34,71,.98);border:1px solid rgba(205,189,255,.15);border-radius:24px;padding:28px 22px;text-align:center;max-width:300px;width:92%;}
.result-box.win{box-shadow:0 0 60px rgba(255,215,0,.45);}
.result-box.lose{box-shadow:0 0 60px rgba(255,100,100,.3);}
.result-box h2{font-size:24px;font-weight:800;color:var(--g);margin:8px 0 4px;}
.result-box p{font-size:12px;color:rgba(205,189,255,.6);margin-bottom:14px;}
.result-box button{display:block;width:100%;padding:12px;margin-top:8px;border:none;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
.result-box button:first-of-type{background:var(--g);color:#1a0a2e;}
.result-box button:not(:first-of-type){background:rgba(205,189,255,.07);color:var(--l);border:1.5px solid rgba(205,189,255,.18);}
</style>
</head>
<body>
<header>
  <div class="logo">🐾 Perfect Paw</div>
  <div id="stage-label">Stage 1</div>
  <div id="score">★ 0</div>
</header>
<div id="game-board"></div>
<div class="bottom">
  <div class="slot-row">
    <div id="slot-count">0/7</div>
    <div id="slot-bar"></div>
  </div>
  <div class="action-btns">
    <!-- UNDO: curved back arrow -->
    <button class="act-btn" onclick="doUndo()" title="Undo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 14 C8 8 14 5 20 7 C26 9 28 15 26 21" stroke="#1a0a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
        <polygon points="6,10 6,18 13,14" fill="#1a0a2e"/>
      </svg>
      <div class="badge"><span id="undo-count">2</span></div>
    </button>
    <!-- SHUFFLE: two circular arrows -->
    <button class="act-btn" onclick="doShuffle()" title="Shuffle">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 10 Q16 3 26 10" stroke="#1a0a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
        <polygon points="24,6 28,11 22,12" fill="#1a0a2e"/>
        <path d="M26 22 Q16 29 6 22" stroke="#1a0a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
        <polygon points="8,26 4,21 10,20" fill="#1a0a2e"/>
      </svg>
      <div class="badge"><span id="shuf-count">1</span></div>
    </button>
    <!-- WITHDRAW: hand pulling card back -->
    <button class="act-btn" onclick="doWithdraw()" title="Withdraw">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="6" width="16" height="20" rx="3" stroke="#1a0a2e" stroke-width="2.5" fill="rgba(26,10,46,0.15)"/>
        <path d="M14 16 L4 16" stroke="#1a0a2e" stroke-width="3" stroke-linecap="round"/>
        <polygon points="7,12 3,16 7,20" fill="#1a0a2e"/>
      </svg>
      <div class="badge">+</div>
    </button>
  </div>
</div>
<div id="overlay"></div>
<script src="game.js"></script>
</body>
</html>
