<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Perfect Paw Match</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#1b0b2f;--s:#27183c;--h:#322247;--g:#ffd700;--l:#cdbdff;--r:#ff6b6b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--l);font-family:'Plus Jakarta Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:rgba(27,11,47,.95);border-bottom:1px solid rgba(205,189,255,.15);flex-shrink:0;}
.logo{font-size:13px;font-weight:800;color:var(--g);}
#score{font-size:13px;font-weight:800;color:var(--g);background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:20px;padding:3px 10px;}
#timer{font-size:17px;font-weight:800;color:var(--g);}
#stage-label{font-size:11px;font-weight:700;color:var(--l);letter-spacing:.1em;}

/* Game layout */
.game-wrap{flex:1;display:flex;align-items:stretch;gap:4px;padding:4px;overflow:hidden;min-height:0;}

/* Side decks */
.side-deck{width:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.deck-wrap{position:relative;width:54px;height:78px;cursor:pointer;}
.deck-wrap:hover{transform:scale(1.05);}
.deck-wrap:active{transform:scale(.95);}
.deck-back-card{position:absolute;width:52px;height:74px;background:linear-gradient(135deg,#3d2e6b,#251847);border:1.5px solid rgba(205,189,255,.5);border-radius:7px;}
.deck-top-card{position:absolute;bottom:0;left:0;width:52px;height:74px;background:linear-gradient(135deg,#4e3f7d,#2d1b69);border:2px solid var(--l);border-radius:7px;overflow:hidden;}
.deck-pattern{width:100%;height:100%;background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(205,189,255,.08) 5px,rgba(205,189,255,.08) 10px),repeating-linear-gradient(-45deg,transparent,transparent 5px,rgba(255,215,0,.04) 5px,rgba(255,215,0,.04) 10px);}
.deck-count{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--l);background:var(--h);border-radius:10px;padding:2px 7px;white-space:nowrap;}
.deck-empty{font-size:20px;color:rgba(205,189,255,.3);}

/* Board */
#game-board{flex:1;position:relative;background:rgba(45,27,105,.12);border:1px solid rgba(205,189,255,.08);border-radius:12px;overflow:hidden;min-width:0;}

/* Tiles */
.tile{position:absolute;width:58px;height:58px;cursor:pointer;border-radius:7px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.7),inset 0 0 0 1px rgba(205,189,255,.25);background:var(--h);transition:transform .08s,box-shadow .08s;}
.tile img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block;}
.tile:hover:not(.blocked){transform:translateY(-5px) scale(1.1);box-shadow:0 10px 28px rgba(255,215,0,.4),inset 0 0 0 2px var(--g);z-index:99999!important;}
.tile:active:not(.blocked){transform:scale(.93);}
.tile.blocked{filter:brightness(.4) saturate(.15);cursor:not-allowed;}

/* Bottom */
.bottom{flex-shrink:0;padding:0 6px 6px;display:flex;flex-direction:column;gap:4px;}
#slot-count{text-align:center;font-size:10px;font-weight:700;color:var(--l);letter-spacing:.1em;}
#slot-bar{display:flex;justify-content:center;gap:4px;background:rgba(45,27,105,.3);border:1px solid rgba(205,189,255,.12);border-radius:10px;padding:6px;min-height:72px;align-items:center;}
.slot{width:56px;height:56px;border:2px dashed rgba(205,189,255,.18);border-radius:7px;background:rgba(50,34,71,.4);display:flex;align-items:center;justify-content:center;}
.slot.filled{border-color:rgba(255,215,0,.4);background:rgba(255,215,0,.06);}
.slot img{width:48px;height:48px;object-fit:cover;border-radius:5px;}

/* Action buttons - 3 big buttons like original */
.action-btns{display:flex;justify-content:center;gap:10px;}
.action-btns button{width:76px;height:52px;border:none;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:transform .1s;line-height:1.3;}
.action-btns button:active{transform:scale(.93);}
#undo-btn{background:var(--g);color:#1a0a2e;box-shadow:0 0 14px rgba(255,215,0,.35);}
#shuffle-btn{background:var(--g);color:#1a0a2e;box-shadow:0 0 14px rgba(255,215,0,.35);}
#restart-btn{background:rgba(205,189,255,.12);color:var(--l);border:2px solid rgba(205,189,255,.25);}

/* Overlay */
#overlay{display:none;position:fixed;inset:0;background:rgba(27,11,47,.9);backdrop-filter:blur(14px);z-index:10000;align-items:center;justify-content:center;}
.result-box{background:rgba(50,34,71,.96);border:1px solid rgba(205,189,255,.2);border-radius:22px;padding:32px 26px;text-align:center;max-width:290px;width:90%;}
.result-box.win{box-shadow:0 0 60px rgba(255,215,0,.35);}
.result-box.lose{box-shadow:0 0 60px rgba(255,107,107,.25);}
.result-box h2{font-size:24px;font-weight:800;color:var(--g);margin:10px 0 8px;}
.result-score{font-size:17px;font-weight:700;color:var(--l);margin-bottom:6px;}
.clear-rate{font-size:14px;font-weight:700;color:var(--r);margin-bottom:6px;}
.result-box p{font-size:12px;color:rgba(205,189,255,.7);margin-bottom:18px;}
.result-box button{display:block;width:100%;padding:12px;margin-top:8px;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
.result-box button:first-of-type{background:var(--g);color:#1a0a2e;}
.result-box button:last-of-type{background:transparent;color:var(--l);border:2px solid rgba(205,189,255,.3);margin-top:6px;}
</style>
</head>
<body>
<header>
  <div class="logo">🐾 Perfect Paw Match</div>
  <div id="stage-label">Stage 1</div>
  <div id="timer">01:30</div>
  <div id="score">★ 0</div>
</header>
<div class="game-wrap">
  <div class="side-deck" id="left-deck"></div>
  <div id="game-board"></div>
  <div class="side-deck" id="right-deck"></div>
</div>
<div class="bottom">
  <div id="slot-count">SLOT: 0 / 7</div>
  <div id="slot-bar"></div>
  <div class="action-btns">
    <button id="undo-btn" onclick="doUndo()">↩<br>UNDO(2)</button>
    <button id="shuffle-btn" onclick="doShuffle()">⟳<br>SHUF(1)</button>
    <button id="restart-btn" onclick="restartGame()">↺<br>RESTART</button>
  </div>
</div>
<div id="overlay"></div>
<script src="game.js"></script>
</body>
</html>
